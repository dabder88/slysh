name: pytest

on:
  push:
    branches: [main, master, prod-launch]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" httpx pytest
      - name: JS syntax check (web/js)
        shell: pwsh
        run: |
          if (Test-Path scripts/check-web-js.ps1) {
            powershell -NoProfile -File scripts/check-web-js.ps1
          } else {
            node --check web/js/main.js
          }
      - name: CSS build
        run: |
          npm ci
          npm run build:css
      - name: Pytest
        env:
          PYTHONPATH: src
          GIGAAM_UI_AUTH: "0"
          GIGAAM_LOOPBACK_STRICT: "0"
          SLYSH_DISABLE_OPENAPI: "1"
          GIGAAM_SKIP_ENGINE: "1"
        run: python -m pytest tests -q
