name: pytest

on:
  push:
    branches: [main, master, prod-launch]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" httpx pytest
      - name: Mandatory checks (wave F)
        shell: pwsh
        env:
          GIGAAM_UI_AUTH: "0"
          GIGAAM_LOOPBACK_STRICT: "0"
          SLYSH_DISABLE_OPENAPI: "1"
          GIGAAM_SKIP_ENGINE: "1"
        run: powershell -NoProfile -File scripts/ci_mandatory_checks.ps1
